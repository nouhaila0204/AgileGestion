spring.application.name=AgileGestion
# 1. Connexion Ã  la base de donnÃ©es
spring.datasource.url=jdbc:mysql://localhost:3306/agileProject_db?createDatabaseIfNotExist=true
spring.datasource.username=root
# Si vous Ãªtes sur XAMPP/WAMP, laissez vide ou mettez votre mot de passe
spring.datasource.password=
# CONFIGURATION DU SERVEUR
server.port=8080

# 2. Configuration JPA (Le moteur qui fait le lien Java <-> SQL)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# "update" = Spring va crÃ©er ou mettre Ã  jour les tables automatiquement
spring.jpa.hibernate.ddl-auto=update
# Affiche les requÃªtes SQL dans la console (pratique pour comprendre)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# ========== CORS ==========
# Pour permettre les requêtes depuis Postman
spring.mvc.cors.allowed-origins=*
spring.mvc.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH

# DÉSACTIVE LA SÉCURITÉ
spring.security.enabled=false

# Configuration utilisateur FIXE (plus besoin de copier)
spring.security.user.name=admin
spring.security.user.password=admin
spring.security.user.roles=USER